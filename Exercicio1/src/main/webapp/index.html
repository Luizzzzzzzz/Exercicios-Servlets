<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h3>Conversor de Temperatura</h3>
	<form action="TipoTemperatura">
		<p>Qual a temperatura?   <input type="number" name="NumTemperatura" size="30">°</p>
		<p>Informe o tipo de conversão:</p>
		<p><input type="radio" name="bTemperatura" value="Celsius -> Farenheit" checked>Celsius -> Farenheit</p>
		<p><input type="radio" name="bTemperatura" value="Farenheit -> Celsius" checked>Farenheit -> Celsius</p>
		<p><input type="radio" name="bTemperatura" value="Celsius -> Kelvin" checked>Celsius -> Kelvin</p>
		<p><input type="radio" name="bTemperatura" value="Kelvin -> Celsius" checked>Kelvin -> Celsius</p>
		<p><input type="radio" name="bTemperatura" value="Farenheit -> Kelvin" checked>Farenheit -> Kelvin</p>
		<p><input type="radio" name="bTemperatura" value="Kelvin -> Farenheit" checked>Kelvin -> Farenheit</p>
		<p><input type="submit" name="btProximo" value="Proximo"></p>
	</form>
</body>
</html>
